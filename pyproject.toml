[project]
name = "qfinlib-research-notes"
version = "0.1.0"
description = "Examples for curve construction and swaption pricing using qfinlib."
authors = [{ name = "Quant Research Team", email = "quant@example.com" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "qfinlib (>=2025.1229.1200,<2026.0.0)",
    "matplotlib>=3.8,<4.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
